baseURL = "https://yaleliyu.github.io/"
title = "Yale Li Yu"
theme = "PaperMod"
languageCode = "en-gb"
defaultContentLanguage = "en"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  author = "Yale Li Yu"
  description = "Applied Machine Learning, LLM Systems, and Software Engineering"
  keywords = ["Machine Learning", "LLM", "Software Engineering", "AI Engineering"]

  defaultTheme = "auto"

  # show blog posts on homepage
  mainSections = ["posts"]

  # professional technical blog settings
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowShareButtons = false
  hideSummary = false

# ONLY top-right navigation item
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

[markup]

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
